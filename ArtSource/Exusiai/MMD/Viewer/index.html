<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能天使 · MMD 模型验证</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#11161d;color:#eeeae4;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{display:grid;grid-template-columns:290px 1fr;height:100vh;min-height:600px}aside{padding:30px 24px;border-right:1px solid #ffffff12;overflow:auto;background:#161c24}
    .eyebrow{font-size:10px;letter-spacing:3px;color:#caae89}h1{font-size:31px;letter-spacing:3px;font-weight:600;margin:13px 0 0}.subtitle{color:#9ea7b2;font-size:12px;margin:3px 0 24px}.badge{display:inline-block;background:#c727601a;border:1px solid #cb507355;border-radius:4px;padding:3px 9px;font-size:11px;color:#f0a6bc}
    .section{border-top:1px solid #ffffff14;margin-top:22px;padding-top:17px}.label{color:#8c97a5;font-size:11px;letter-spacing:1px;margin-bottom:10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{font:inherit;font-size:12px;border:1px solid #ffffff1c;background:#202933;color:#dfe4e9;border-radius:5px;cursor:pointer;padding:8px 10px}button:hover,button.active{background:#a930551f;border-color:#bc466a;color:#ffd7e2}label{display:flex;align-items:center;gap:9px;margin:11px 0;color:#ccd2d9;font-size:12px}input{accent-color:#cb426c}
    .reference{background:#f7f7f5;border-radius:5px;overflow:hidden;margin-top:10px}.reference img{display:block;width:100%;height:215px;object-fit:contain}.note{font-size:11px;color:#8f99a6;margin-top:10px}.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#313a48 0%,#202832 45%,#10161e 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}.topbar{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;pointer-events:none;font-size:11px;letter-spacing:1px;color:#9ca8b7}.topbar strong{font-weight:500;color:#ebe5db}.hint{position:absolute;bottom:23px;left:0;right:0;text-align:center;color:#95a0ae;font-size:11px;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#17202af0;color:#c9bda9;pointer-events:none}.stat{display:flex;justify-content:space-between;font-size:12px;margin:6px 0;color:#9ba6b3}.stat span:last-child{color:#dee3e8}
    @media(max-width:720px){main{grid-template-columns:190px 1fr}aside{padding:18px 13px}h1{font-size:24px}.reference img{height:150px}.topbar{left:15px;right:15px}.hint{padding:0 12px}}
  </style>
  <script type="importmap">{"imports":{"three":"../../Viewer/vendor/three.module.js"}}</script>
</head>
<body>
<main>
  <aside>
    <div class="eyebrow">ARKNIGHTS / CHARACTER STUDY</div>
    <h1>能天使</h1><div class="subtitle">EXUSIAI · MMD · UNITY IMPORT</div>
    <span class="badge">骨骼与表情验证版</span>
    <div class="section"><div class="label">观察角度</div><div class="buttons">
      <button data-view="three" class="active">斜侧面</button><button data-view="front">正面</button>
      <button data-view="side">侧面</button><button data-view="back">背面</button>
      <button data-view="face">脸部</button><button data-view="three">重置视角</button>
    </div></div>
    <div class="section"><div class="label">显示</div>
      <label><input id="rotate" type="checkbox">自动旋转</label>
      <label><input id="wire" type="checkbox">查看网格</label>
      <label><input id="play" type="checkbox">播放骨骼测试</label><label><input id="blink" type="checkbox">闭眼表情</label><label><input id="bones" type="checkbox">显示骨骼</label>
    </div>
    <div class="section"><div class="label">立绘参考</div><div class="reference"><img src="../../Reference.png" alt="用户提供的能天使立绘"></div><div class="note">保留 MMD 原骨骼，Unity 使用 Generic 动画。测试动作检查原约束烘焙效果；原包未提供游戏动作。网页展示 GLB，Unity 结果请打开预览场景。</div></div>
    <div class="section"><div class="label">模型信息</div><div class="stat"><span>网格</span><span id="meshes">加载中</span></div><div class="stat"><span>三角面</span><span id="tris">—</span></div><div class="stat"><span>资源格式</span><span>FBX / GLB / BLEND</span></div></div>
  </aside>
  <section class="stage" id="stage"><div class="topbar"><strong>PENGUIN LOGISTICS</strong><span>01 / MODEL PREVIEW</span></div><canvas id="canvas"></canvas><div class="hint">拖动旋转 · 滚轮缩放 · 右键拖动平移</div><div class="loading" id="loading">正在加载能天使模型…</div></section>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '../../Viewer/vendor/OrbitControls.js';
import { GLTFLoader } from '../../Viewer/vendor/GLTFLoader.js';
const stage=document.getElementById('stage'), canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(33,1,.02,100);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=.32;controls.maxDistance=7;controls.maxPolarAngle=Math.PI*.94;
scene.add(new THREE.HemisphereLight(0xdde8ff,0x645244,2));
function light(color,intensity,position){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...position);scene.add(l);return l}
const key=light(0xffeddb,3.0,[-3,5,4]);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-1.5;key.shadow.camera.right=1.5;key.shadow.camera.top=2;key.shadow.camera.bottom=-1;key.shadow.normalBias=.005;key.shadow.bias=-.0001;
light(0xc8ddff,1.0,[3,2,3]);light(0xffc9a0,2.5,[1,3,-3]);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:.22}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.002;scene.add(floor);
let model,mixer,skeleton; const clock=new THREE.Clock();
const views={three:[[1.7,1.40,3.65],[0,.88,0]],front:[[0,1.1,3.9],[0,.88,0]],side:[[3.9,1.1,0],[0,.88,0]],back:[[0,1.1,-3.9],[0,.88,0]],face:[[.16,1.51,1.0],[0,1.49,0]]};
function view(key){const [position,target]=views[key];camera.position.set(...position);controls.target.set(...target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));}
view('three');
new GLTFLoader().load('../PreservedRig/Exusiai_MMD_Preserved.glb?v=preserved-1',gltf=>{
 model=gltf.scene;model.scale.setScalar(0.9753654599189758);scene.add(model);mixer=new THREE.AnimationMixer(model);if(gltf.animations.length)mixer.clipAction(gltf.animations[0]).play();skeleton=new THREE.SkeletonHelper(model);skeleton.visible=false;scene.add(skeleton);const box=new THREE.Box3().setFromObject(model);model.position.y-=box.min.y;
 let meshes=0,tris=0;model.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;meshes++;tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3}});
 document.getElementById('meshes').textContent=meshes+' 个';document.getElementById('tris').textContent=Math.round(tris).toLocaleString();document.getElementById('loading').style.display='none';
},undefined,error=>{document.getElementById('loading').textContent='模型加载失败，请通过本地预览服务打开。';console.error(error)});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>view(b.dataset.view)));
document.getElementById('rotate').addEventListener('change',e=>{controls.autoRotate=e.target.checked;controls.autoRotateSpeed=.7});
document.getElementById('wire').addEventListener('change',e=>model?.traverse(o=>{if(o.isMesh){for(const m of [].concat(o.material))m.wireframe=e.target.checked}}));
document.getElementById('blink').addEventListener('change',e=>model?.traverse(o=>{if(o.morphTargetDictionary){const i=o.morphTargetDictionary['まばたき'];if(i!==undefined)o.morphTargetInfluences[i]=e.target.checked?1:0}}));
document.getElementById('bones').addEventListener('change',e=>{if(skeleton)skeleton.visible=e.target.checked});
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe(stage);
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer&&document.getElementById('play').checked)mixer.update(dt);controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
