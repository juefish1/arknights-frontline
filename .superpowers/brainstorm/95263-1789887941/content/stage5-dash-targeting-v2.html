<style>
  #dash-targeting .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #dash-targeting .field {
    position: relative;
    min-height: 270px;
    overflow: hidden;
    background: color-mix(in srgb, var(--bg-primary) 58%, var(--bg-secondary));
  }
  #dash-targeting .lane {
    position: absolute; left: 4%; right: 4%; top: 42%; height: 24%;
    background: color-mix(in srgb, var(--text-primary) 13%, transparent);
    transform: perspective(280px) rotateX(46deg);
  }
  #dash-targeting .operator {
    position: absolute; left: 27%; top: 51%; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); transform: translate(-50%,-50%);
  }
  #dash-targeting .enemy {
    position: absolute; right: 22%; top: 45%; width: 15px; height: 15px;
    background: var(--error);
  }
  #dash-targeting .range-ring {
    position: absolute; left: 27%; top: 51%; width: 154px; height: 154px;
    border: 2px solid color-mix(in srgb, var(--accent) 72%, transparent);
    border-radius: 50%; transform: translate(-50%,-50%);
  }
  #dash-targeting .path {
    position: absolute; left: 29%; top: 49%; width: 43%; height: 4px;
    background: var(--success); transform: rotate(-7deg); transform-origin: left center;
  }
  #dash-targeting .path::after {
    content: ""; position: absolute; right: -2px; top: -6px;
    border-left: 12px solid var(--success); border-top: 8px solid transparent; border-bottom: 8px solid transparent;
  }
  #dash-targeting .destination {
    position: absolute; right: 25%; top: 43%; width: 42px; height: 42px;
    border: 3px solid var(--success); border-radius: 50%;
    background: color-mix(in srgb, var(--success) 18%, transparent);
  }
  #dash-targeting .corridor {
    position: absolute; left: 28%; top: 42%; width: 48%; height: 42px;
    background: color-mix(in srgb, var(--success) 20%, transparent);
    border-block: 2px solid var(--success);
    transform: rotate(-7deg); transform-origin: left center;
  }
  #dash-targeting .invalid .path { background: var(--error); }
  #dash-targeting .invalid .path::after { border-left-color: var(--error); }
  #dash-targeting .invalid .destination { border-color: var(--error); background: color-mix(in srgb, var(--error) 18%, transparent); }
  #dash-targeting .caption {
    position: absolute; left: 10px; top: 10px; color: var(--text-primary);
    background: color-mix(in srgb, var(--bg-secondary) 78%, transparent); padding: 4px 7px;
  }
  @media (max-width: 820px) { #dash-targeting .cards { grid-template-columns: 1fr; } }
</style>

<div id="dash-targeting">
  <h2>E 冲锋模式：瞄准时显示什么？</h2>
  <p class="subtitle">按 E 进入瞄准，左键确认；右键或 Esc 取消。非法位置统一变红且不消耗技能。</p>

  <div class="cards">
    <div class="card" data-choice="dash-a" onclick="toggleSelect(this)">
      <div class="card-image field">
        <div class="lane"></div><div class="range-ring"></div><div class="path"></div><div class="destination"></div><div class="operator"></div><div class="enemy"></div>
        <span class="caption">最大距离 + 路径 + 落点</span>
      </div>
      <div class="card-body">
        <h3>A · 完整战术指示（推荐）</h3>
        <p>最大 7 单位范围、冲刺路径和落点同时可见；最容易判断是否合法。</p>
      </div>
    </div>

    <div class="card" data-choice="dash-b" onclick="toggleSelect(this)">
      <div class="card-image field invalid">
        <div class="lane"></div><div class="path"></div><div class="destination"></div><div class="operator"></div><div class="enemy"></div>
        <span class="caption">路径 + 落点</span>
      </div>
      <div class="card-body">
        <h3>B · 精简箭头</h3>
        <p>画面更干净，但玩家不容易预判最大距离，只能依赖落点变色。</p>
      </div>
    </div>

    <div class="card" data-choice="dash-c" onclick="toggleSelect(this)">
      <div class="card-image field">
        <div class="lane"></div><div class="range-ring"></div><div class="corridor"></div><div class="destination"></div><div class="operator"></div><div class="enemy"></div>
        <span class="caption">范围 + 冲刺走廊</span>
      </div>
      <div class="card-body">
        <h3>C · 冲刺走廊</h3>
        <p>强调沿途空间，适合会碰撞或命中路径目标的技能；本阶段功能可能过度表达。</p>
      </div>
    </div>
  </div>
</div>
